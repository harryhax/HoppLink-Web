# Location blocks for the website's existing HTTPS server block. Install by hand; see docs/deployment.md.
# They leave its server_name, listen and certificate lines, and the API's own server block, unchanged.
#
# The existing "root" line stays pointed at the document root, which is now a symlink to the live release.
# A location with add_header stops inheriting the server block's add_header lines, so if the server block
# has any (for example Strict-Transport-Security), repeat them in the three locations below that use it.

# The API on the website's own origin, so the browser's relative /api requests and session cookie work.
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

# Build output has content-hashed names. A missing file must be a 404, never the page.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /release.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# The page itself, and the fallback so that refreshing any address loads the frontend.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
}
