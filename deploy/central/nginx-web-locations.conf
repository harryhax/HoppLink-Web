# Location blocks for the website's existing HTTPS server block. Install by hand; see docs/deployment.md.
# They leave its server_name, listen and certificate lines, and the API's own server block, unchanged.
#
# The existing "root" line stays pointed at the document root, which is now a symlink to the live release.
# A location with add_header stops inheriting the server block's add_header lines, so if the server block
# has any (for example Strict-Transport-Security), repeat them in the locations below that use it.

# The API on the website's own origin, so the browser's relative /api requests and session cookie work.
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

# Build output has content-hashed names. A missing file must be a 404, never the page.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /release.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# Desktop app downloads: the release manifest and builds, uploaded by hand over SSH to /srv/hopplink-downloads.
# That directory is outside the document root and the release directories, so deployments never replace or
# remove it. See "Desktop app downloads" in docs/deployment.md. The /downloads page itself is the frontend,
# served by "location /" below.
#
# The manifest, never cached so a new release shows at once. An exact match wins over every other location.
location = /downloads/releases/manifest.json {
    alias /srv/hopplink-downloads/manifest.json;
    limit_except GET { deny all; }
    disable_symlinks on;
    types { }
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# A build: one plain file name with a build extension, and nothing else. No slash, so no subdirectory or "..";
# no leading dot, so no hidden or temporary files. Files are only ever sent, as downloads, never run or shown.
# Keep this before any other regex location in the server block that could match these extensions.
location ~ "^/downloads/releases/([A-Za-z0-9][A-Za-z0-9._-]{0,127}\.(?:zip|dmg|pkg|msi|exe))$" {
    alias /srv/hopplink-downloads/$1;
    limit_except GET { deny all; }
    disable_symlinks on;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Anything else under /downloads/releases/ is a 404: no directory listing, and never the page fallback.
location /downloads/releases/ {
    return 404;
}

# Temporary, until there's a marketing homepage: the homepage is a 302 to the downloads page. Only / itself: the
# signed-in application loads from /login (or any other address, through the fallback below), so nothing loops.
# Remove this block to restore the homepage. See src/home-redirect.js for the browser-side part.
location = / {
    return 302 /downloads$is_args$args;
}

# The page itself, and the fallback so that refreshing any address loads the frontend.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
}
